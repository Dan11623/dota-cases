{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4 text-center">Сокровищницы Dota 2</h2>
<div class="row justify-content-center">
    {% for case in cases %}
    <div class="col-md-5 mb-4">
        <div class="card bg-dark border-secondary text-center p-3 h-100">
            <img src="{{ case.image_url }}" class="mx-auto" width="200">
            <div class="card-body">
                <h4>{{ case.name }}</h4>
                <p class="text-secondary">{{ case.description }}</p>
                <a href="/case/{{ case.id }}/" class="btn btn-warning fw-bold w-100">Открыть за {{ case.price }} ₽</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
